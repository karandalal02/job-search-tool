<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Search Tool{% endblock %}</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --border: #2a2e37;
        --accent: #3b82f6;
        --accent-fg: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    nav { display: flex; gap: 16px; padding: 16px; border-bottom: 1px solid var(--border); align-items: center; }
    nav a { color: var(--fg); text-decoration: none; font-weight: 500; }
    nav a:hover { color: var(--accent); }
    nav .spacer { flex: 1; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; }
    form.inline { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 24px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    input, select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font-size: 0.95rem;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
    a.job-link { color: var(--accent); text-decoration: none; word-break: break-all; }
    a.job-link:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; background: var(--border); color: var(--fg); }
    .flash { background: var(--border); padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .company-block { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .company-block h3 { margin: 0 0 8px; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .search-link { font-size: 0.85rem; margin-top: 8px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('companies') }}">Companies</a>
    <a href="{{ url_for('bulk') }}">Bulk Search</a>
    <a href="{{ url_for('targeted') }}">Targeted Search</a>
    <div class="spacer"></div>
    {% if session.get('authed') %}<a href="{{ url_for('logout') }}">Log out</a>{% endif %}
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
